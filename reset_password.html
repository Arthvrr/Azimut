<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azimut - Réinitialisation du Mot de Passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { scout: { green: '#2E7D32', dark: '#1B5E20' } } } } }
    </script>
    <link rel="icon" type="image/x-icon" href="../logo/logo.ico">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="../logo/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // Eviter le flash blanc au chargement
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        /* Implémentation du Dark Mode globale */
        html.dark body { background-color: #111827; color: #e5e7eb; }
        html.dark .bg-white { background-color: #1f2937 !important; border-color: #374151 !important; }
        html.dark .bg-gray-50 { background-color: #111827 !important; border-color: #374151 !important; }
        html.dark .text-gray-900 { color: #f9fafb !important; }
        html.dark .text-gray-800 { color: #f3f4f6 !important; }
        html.dark .text-gray-700 { color: #d1d5db !important; }
        html.dark .text-gray-600 { color: #9ca3af !important; }
        html.dark .text-gray-500 { color: #9ca3af !important; }
        html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300 { border-color: #374151 !important; }
        html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #374151 !important; }
        html.dark nav { background-color: #1f2937 !important; border-bottom-color: #374151 !important; }
        html.dark input, html.dark select, html.dark textarea { background-color: #374151 !important; color: #f9fafb !important; border-color: #4b5563 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-900 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                <a href="../index.html"><img src="../logo/logo.png" alt="Azimut" class="w-full h-full object-contain rounded-lg"></a>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Azimut <span class="text-sm font-normal text-gray-500 ml-2">Sécurité</span></h1>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <!-- Bouton Dark Mode -->
            <button id="theme-toggle" type="button" class="text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 rounded-lg text-sm p-2.5 transition-colors focus:outline-none" aria-label="Toggle Dark Mode">
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Nouveau mot de passe</h2>
            
            <!-- Message par défaut si pas de jeton -->
            <div id="unauthorizedMsg" class="text-center py-6">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>
                <p class="text-gray-600 font-medium">Lien de récupération invalide ou expiré.</p>
                <p class="text-sm text-gray-500 mt-2">Veuillez refaire une demande de mot de passe oublié depuis l'écran de connexion.</p>
                <a href="../index.html" class="inline-block mt-6 text-sm font-bold text-gray-900 hover:underline">Retour à l'accueil</a>
            </div>

            <!-- Formulaire caché par défaut -->
            <div id="resetContainer" class="hidden">
                <p class="text-sm text-gray-500 mb-6 text-center">Entrez votre nouveau mot de passe pour sécuriser votre compte.</p>
                
                <form id="resetForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nouveau mot de passe (min. 6 car.)</label>
                        <div class="relative">
                            <input type="password" id="newPassword" required class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-gray-900 bg-gray-50 pr-10">
                            <button type="button" onclick="togglePassword('newPassword', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Confirmez le mot de passe</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" required class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-gray-900 bg-gray-50 pr-10">
                            <button type="button" onclick="togglePassword('confirmPassword', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white px-4 py-3 rounded-lg font-bold hover:bg-black transition-colors">Enregistrer et me connecter</button>
                    <p id="statusMsg" class="text-sm font-bold text-center mt-4"></p>
                </form>
            </div>
        </div>
    </main>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg class="w-5 h-5 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
            }
        }
        
        const supabaseUrl = 'https://nbhpninmmpayivjqhouj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iaHBuaW5tbXBheWl2anFob3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NTgyNzMsImV4cCI6MjA5ODEzNDI3M30.A6BdwmCVq6uWK6hlNekvetek3Er3LfO67vfwlRPpcpU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Au chargement, on vérifie si un lien magique de récupération a été utilisé
        window.addEventListener('load', () => {
            if (window.location.hash.includes('type=recovery')) {
                // On cache l'erreur et on affiche le formulaire
                document.getElementById('unauthorizedMsg').classList.add('hidden');
                document.getElementById('resetContainer').classList.remove('hidden');
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Vérification de correspondance
            if (password !== confirmPassword) {
                msg.textContent = "Les mots de passe ne correspondent pas.";
                msg.className = "text-sm font-bold text-center mt-4 text-red-600";
                return;
            }

            if (password.length < 6) {
                msg.textContent = "Le mot de passe doit faire au moins 6 caractères.";
                msg.className = "text-sm font-bold text-center mt-4 text-red-600";
                return;
            }

            btn.disabled = true; btn.textContent = "Mise à jour...";
            
            // Mise à jour du mot de passe dans Supabase
            const { error } = await supabaseClient.auth.updateUser({ password: password });
            
            if (error) {
                msg.textContent = error.message;
                msg.className = "text-sm font-bold text-center mt-4 text-red-600";
                btn.disabled = false; btn.textContent = "Enregistrer et me connecter";
            } else {
                msg.textContent = "Mot de passe mis à jour ! Redirection...";
                msg.className = "text-sm font-bold text-center mt-4 text-green-600";
                
                // Redirection intelligente selon le rôle de l'utilisateur
                const email = (await supabaseClient.auth.getSession()).data.session.user.email;
                
                const { data: superadmin } = await supabaseClient.from('superadmins').select('id').eq('email', email).maybeSingle();
                if (superadmin) { window.location.replace('frontend/superadmin.html'); return; }
                
                const { data: admin } = await supabaseClient.from('admins').select('id').eq('email', email).maybeSingle();
                if (admin) { window.location.replace('frontend/admin.html'); return; }
                
                window.location.replace('frontend/parent.html');
            }
        });

        // Script du Dark Mode
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    </script>
</body>
</html>
